<div class="clock card">
  @if (greeting(); as g) {
    <p class="clock__greeting">{{ g }}</p>
  }
  <button class="clock__button" type="button" title="Temporizador y alarmas" (click)="openTools.emit()">
    <time class="clock__time">{{ time() }}</time>
    <span class="visually-hidden">Abrir temporizador y alarmas</span>
  </button>
  <p class="clock__date">{{ date() }}</p>
  <p class="clock__hint">Toca la hora para el temporizador y las alarmas</p>
</div>
