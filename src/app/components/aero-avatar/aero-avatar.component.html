@let a = avatar();
<svg [attr.viewBox]="viewBox()" xmlns="http://www.w3.org/2000/svg" role="img" [attr.aria-label]="'Avatar ' + a.label">
  <defs>
    <!-- Relleno de gel: claro arriba a la izquierda → principal → profundo en los bordes -->
    <radialGradient [attr.id]="uid + '-fill'" cx="38%" cy="28%" r="80%">
      <stop offset="0%" [attr.stop-color]="a.light" />
      <stop offset="55%" [attr.stop-color]="a.main" />
      <stop offset="100%" [attr.stop-color]="a.deep" />
    </radialGradient>
    <!-- Luz interna en la parte de abajo (como si brillara por dentro) -->
    <radialGradient [attr.id]="uid + '-glow'" cx="50%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Reflejo superior -->
    <linearGradient [attr.id]="uid + '-shine'" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    @if (a.sheen) {
      <!-- Brillo iridiscente (michi) -->
      <linearGradient [attr.id]="uid + '-sheen'" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" [attr.stop-color]="a.sheen" stop-opacity="0" />
        <stop offset="50%" [attr.stop-color]="a.sheen" stop-opacity="0.45" />
        <stop offset="100%" [attr.stop-color]="a.sheen" stop-opacity="0" />
      </linearGradient>
    }
    @if (a.accessory === 'cone') {
      <linearGradient [attr.id]="uid + '-cone'" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#ffb347" />
        <stop offset="55%" stop-color="#ff7a12" />
        <stop offset="100%" stop-color="#d9560b" />
      </linearGradient>
    }
  </defs>

  @if (a.shape === 'cat') {
    <!-- ===== Michi de gelatina ===== -->
    <g [attr.stroke]="a.deep" stroke-width="1.5" stroke-linejoin="round">
      <!-- patitas -->
      <circle cx="27" cy="84" r="9" [attr.fill]="url('fill')" />
      <circle cx="42" cy="86" r="9" [attr.fill]="url('fill')" />
      <circle cx="58" cy="86" r="9" [attr.fill]="url('fill')" />
      <circle cx="73" cy="84" r="9" [attr.fill]="url('fill')" />
      <!-- orejas -->
      <path d="M22 40 L26 16 L42 28 Z" [attr.fill]="url('fill')" />
      <path d="M78 40 L74 16 L58 28 Z" [attr.fill]="url('fill')" />
      <!-- cabeza-cuerpo -->
      <ellipse cx="50" cy="52" rx="34" ry="28" [attr.fill]="url('fill')" />
    </g>
    <ellipse cx="50" cy="52" rx="34" ry="28" [attr.fill]="url('glow')" />
    @if (a.sheen) {
      <ellipse cx="50" cy="52" rx="34" ry="28" [attr.fill]="url('sheen')" />
    }
    <!-- carita -->
    <g [attr.fill]="a.deep">
      <ellipse cx="38" cy="56" rx="3.2" ry="3.8" />
      <ellipse cx="62" cy="56" rx="3.2" ry="3.8" />
      <path d="M47.5 61 L52.5 61 L50 64 Z" />
    </g>
    <g [attr.stroke]="a.deep" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
      <path d="M45 33 L45 38 M50 32 L50 37 M55 33 L55 38" />
      <path d="M26 57 L32 57 M27 61 L32 60 M74 57 L68 57 M73 61 L68 60" />
    </g>
    <!-- reflejos -->
    <ellipse cx="38" cy="36" rx="12" ry="5.5" [attr.fill]="url('shine')" transform="rotate(-18 38 36)" />
    <circle cx="70" cy="44" r="2.4" fill="#ffffff" opacity="0.85" />
  } @else {
    <!-- ===== Figura de gel ===== -->
    @if (a.accessory === 'antenna') {
      <g [attr.stroke]="a.deep" stroke-width="2.4" stroke-linecap="round">
        <path d="M41 15 L34 4" />
        <path d="M59 15 L66 4" />
      </g>
      <circle cx="33" cy="4" r="4" [attr.fill]="url('fill')" [attr.stroke]="a.deep" stroke-width="1.2" />
      <circle cx="67" cy="4" r="4" [attr.fill]="url('fill')" [attr.stroke]="a.deep" stroke-width="1.2" />
    }

    <g [attr.stroke]="a.deep" stroke-width="1.6" stroke-linejoin="round">
      <!-- cuerpo -->
      <path
        d="M50 54 C30 54 16 64 14 82 C13 92 20 97 30 97 L70 97 C80 97 87 92 86 82 C84 64 70 54 50 54 Z"
        [attr.fill]="url('fill')"
      />
      <!-- cabeza -->
      <circle cx="50" cy="31" r="19" [attr.fill]="url('fill')" />
    </g>
    <!-- luz interna -->
    <path
      d="M50 54 C30 54 16 64 14 82 C13 92 20 97 30 97 L70 97 C80 97 87 92 86 82 C84 64 70 54 50 54 Z"
      [attr.fill]="url('glow')"
    />
    <circle cx="50" cy="31" r="19" [attr.fill]="url('glow')" opacity="0.6" />
    <!-- reflejos -->
    <ellipse cx="43" cy="21" rx="9" ry="5" [attr.fill]="url('shine')" transform="rotate(-22 43 21)" />
    <ellipse cx="37" cy="65" rx="12" ry="4.5" [attr.fill]="url('shine')" opacity="0.7" transform="rotate(-14 37 65)" />
    <circle cx="61" cy="25" r="1.8" fill="#ffffff" opacity="0.8" />

    @if (a.accessory === 'cone') {
      <!-- cono naranja con franjas blancas, sobre la cabeza -->
      <polygon points="39,13 61,13 53,-20 47,-20" [attr.fill]="url('cone')" stroke="#b8470a" stroke-width="1" />
      <polygon points="44.1,-8 55.9,-8 57.1,-3 42.9,-3" fill="#ffffff" opacity="0.92" />
      <polygon points="41.4,3 58.6,3 59.8,8 40.2,8" fill="#ffffff" opacity="0.92" />
      <rect x="30" y="11" width="40" height="6" rx="2" fill="#e8650f" stroke="#b8470a" stroke-width="1" />
      <rect x="32" y="11.6" width="36" height="1.6" rx="0.8" fill="#ffffff" opacity="0.45" />
      <ellipse cx="50" cy="-20" rx="3" ry="1" fill="#b8470a" />
    }
  }
</svg>
