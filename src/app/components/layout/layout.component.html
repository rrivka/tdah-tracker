<div class="layout">
  <header class="layout__header">
    <h1 class="layout__title">{{ appName }}</h1>
    <div class="layout__header-actions">
      <!-- Indicador del temporizador: se ve si está corriendo, en pausa o terminado -->
      @if (timer.active()) {
        <button
          class="layout__timer-indicator"
          type="button"
          [class.is-finished]="timer.state() === 'finished'"
          [attr.aria-label]="'Temporizador: ' + timerLabel()"
          (click)="showTool('timer')"
        >
          ⏱ {{ timerLabel() }}
        </button>
      }
      <span class="layout__user-name">{{ userName() }}</span>
      <button
        class="layout__settings-button"
        type="button"
        [attr.aria-pressed]="section() === 'settings'"
        (click)="toggleSettings()"
      >
        Ajustes
      </button>
      <button class="layout__logout-button" type="button" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  @if (error()) {
    <p class="layout__error" role="alert">{{ error() }}</p>
  }

  <main class="layout__main">
    <!-- Columna lateral (escritorio): reloj y calendario -->
    <div class="layout__column layout__column--side">
      <section class="layout__section layout__section--clock" [class.is-active]="section() === 'clock'">
        <app-clock (openTools)="showTool(tool())" />
      </section>

      <section class="layout__section layout__section--calendar" [class.is-active]="section() === 'calendar'">
        <app-calendar />
      </section>
    </div>

    <!-- Columna principal (escritorio): rachas, actividades constantes y pendientes -->
    <div class="layout__column layout__column--main">
      <section class="layout__section layout__section--streaks" [class.is-active]="section() === 'streaks'">
        <app-streak-board (createRequested)="requestCreate('streak')" />
      </section>

      <section class="layout__section layout__section--tasks" [class.is-active]="section() === 'tasks'">
        <app-routine-list />
        <app-task-list (createRequested)="requestCreate('task')" />
      </section>
    </div>

    <section
      class="layout__section layout__section--settings"
      [class.is-active]="section() === 'settings'"
    >
      <app-settings />
    </section>
  </main>

  <!-- Temporizador y alarmas: se abren al tocar la hora del reloj -->
  <app-modal [open]="toolsOpen()" title="Temporizador y alarmas" (closed)="toolsOpen.set(false)">
    <div class="layout__tools">
      <div class="layout__tool-tabs" role="tablist" aria-label="Herramientas">
        <button
          class="layout__tool-tab"
          type="button"
          role="tab"
          [class.is-active]="tool() === 'timer'"
          [attr.aria-selected]="tool() === 'timer'"
          (click)="tool.set('timer')"
        >
          Temporizador
        </button>
        <button
          class="layout__tool-tab"
          type="button"
          role="tab"
          [class.is-active]="tool() === 'alarms'"
          [attr.aria-selected]="tool() === 'alarms'"
          (click)="tool.set('alarms')"
        >
          Alarmas
        </button>
      </div>
      <div class="layout__tool-panel" role="tabpanel">
        @if (tool() === 'timer') {
          <app-timer />
        } @else {
          <app-alarms />
        }
      </div>
    </div>
  </app-modal>

  <!-- Navegación inferior: solo se ve en el teléfono -->
  <nav class="layout__bottom-nav" aria-label="Secciones">
    @for (item of navItems; track item.id) {
      <button
        class="layout__nav-button"
        type="button"
        [class.is-active]="section() === item.id"
        [attr.aria-current]="section() === item.id ? 'page' : null"
        (click)="show(item.id)"
      >
        {{ item.label }}
      </button>
    }
  </nav>

  <!-- Temporizador flotante (ventana encima de todo o recuadro en la esquina) -->
  @if (timer.floating()) {
    <app-floating-timer />
  }

  <!-- Ventana "Agregar" (pendiente / constante / racha). Fuera de las secciones para abrirse desde cualquiera. -->
  <app-create-dialog [request]="createRequest()" />

  <!-- Aviso de alarma / fin del temporizador -->
  <app-ringing-overlay />
</div>
