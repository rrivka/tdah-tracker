@switch (avatar().kind) {
  @case ('aero') {
    @if (aero(); as a) {
      <app-aero-avatar class="avatar__aero" [avatar]="a" />
    }
  }
  @case ('photo') {
    <!-- referrerpolicy: necesario para que Google muestre la foto fuera de sus páginas -->
    <img class="avatar__photo" [src]="avatar().value" alt="" referrerpolicy="no-referrer" />
  }
  @case ('emoji') {
    <span class="avatar__emoji" aria-hidden="true">{{ avatar().value }}</span>
  }
  @default {
    <span class="avatar__initial" aria-hidden="true">{{ avatar().value }}</span>
  }
}
